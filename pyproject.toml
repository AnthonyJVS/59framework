[project]
name = "test-automation-framework"
version = "0.1.0"
description = "Playwright + pytest test automation framework with a Streamlit control-panel dashboard"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "smoke: fast critical-path checks run on every push",
    "regression: full business-flow coverage",
    "api: API contract tests (Playwright APIRequestContext)",
    "ui: browser UI tests (Page Object based, Mode A)",
    "scanner: generic site-scanner tests against an arbitrary URL (Mode B)",
    "cross_browser: tests that must run on chromium, firefox and webkit",
    "performance: k6-backed performance checks",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]
